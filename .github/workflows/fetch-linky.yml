name: Fetch Linky data

on:
  schedule:
    - cron: "0 9 * * *"   # tous les jours à 9h UTC (10h/11h en France) — laisse à Enedis le temps de publier le J-1
  workflow_dispatch: {}    # permet de lancer manuellement depuis GitHub

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Linky data
        env:
          MED_TOKEN: ${{ secrets.MED_TOKEN }}
          MED_PDL: ${{ secrets.MED_PDL }}
        run: node fetch-linky.js

      - name: Commit data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update Linky data.json"
          git push
